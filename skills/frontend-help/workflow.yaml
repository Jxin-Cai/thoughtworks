# Frontend 垂直 Feature 工作流定义
# frontend-thought / frontend-works 读取此文件决定执行顺序

name: frontend-vertical
version: 3
description: 前端垂直 Feature 工作流——每个 Feature 经历完整的 design→confirm→code 生命周期

# Features 在 assessment 阶段动态定义（非静态列表）
# 每个 Feature 经过: pending → designing → designed → confirmed → coding → coded

agents:
  thinker: ../../agents/agent-frontend-thinker.md
  worker: ../../agents/agent-frontend-worker.md

design-template: ../frontend-thought/assets/feature-design.md

# 验证模式：Worker 实现后自检产物
verify:
  - pattern: "**/src/pages/**/*.tsx"
    description: 页面组件
  - pattern: "**/src/features/**/*.{ts,tsx}"
    description: Feature slice
  - pattern: "**/src/entities/**/*.{ts,tsx}"
    description: Entity slice
  - pattern: "**/src/shared/api/**/*.ts"
    description: API 客户端
  - pattern: "**/src/app/router/**/*.{ts,tsx}"
    description: 路由配置

state-machine:
  states: [pending, designing, designed, confirmed, coding, coded, failed]
  transitions:
    - from: pending
      to: designing
      trigger: thinker-start
    - from: designing
      to: designed
      trigger: subagent-stop
    - from: designing
      to: designing
      trigger: thinker-start
    - from: designed
      to: confirmed
      trigger: user-confirm
    - from: confirmed
      to: coding
      trigger: worker-start
    - from: coding
      to: coded
      trigger: subagent-stop
    - from: [designing, coding]
      to: failed
      trigger: error
    - from: failed
      to: pending
      trigger: retry
