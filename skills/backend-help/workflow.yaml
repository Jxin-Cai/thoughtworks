# DDD 垂直子域工作流定义
# backend-thought / backend-works 读取此文件决定执行顺序

name: ddd-vertical
version: 4
description: DDD 垂直子域工作流——每个子域经历完整的 design→confirm→code 生命周期

# 子域在 assessment 阶段动态定义（非静态列表）
# 每个子域经过: pending → designing → designed → confirmed → coding → coded

agents:
  thinker: ../../agents/agent-ddd-thinker.md
  worker: ../../agents/agent-ddd-worker.md

design-template: ../backend-thought/assets/subdomain-design.md

# 验证模式：Worker 实现后按层自检产物是否存在
verify:
  java:
    domain:
      - pattern: "**/domain/**/model/*.java"
        description: 领域模型类
      - pattern: "**/domain/**/repository/*.java"
        description: 仓储接口
    infr:
      - pattern: "**/infr/repository/**/*RepositoryImpl.java"
        description: 仓储实现
      - pattern: "**/infr/repository/**/*PO.java"
        description: PO 对象
    application:
      - pattern: "**/application/**/*ApplicationService.java"
        description: 应用服务
      - pattern: "**/application/**/*Command.java"
        description: Command 对象
    ohs:
      - pattern: "**/ohs/**/*Controller.java"
        description: Controller
      - pattern: "**/ohs/**/*Request.java"
        description: Request DTO
  python:
    domain:
      - pattern: "**/domain/**/model/*.py"
        description: 领域模型类
      - pattern: "**/domain/**/repository/*.py"
        description: 仓储接口
    infr:
      - pattern: "**/infr/repository/**/*_repository_impl.py"
        description: 仓储实现
      - pattern: "**/infr/repository/**/*_model.py"
        description: ORM Model
    application:
      - pattern: "**/application/**/*_application_service.py"
        description: 应用服务
      - pattern: "**/application/**/*_command.py"
        description: Command
    ohs:
      - pattern: "**/ohs/**/*_router.py"
        description: Router
  go:
    domain:
      - pattern: "**/domain/**/model/*.go"
        description: 领域模型
      - pattern: "**/domain/**/repository/*.go"
        description: 仓储接口
    infr:
      - pattern: "**/infr/repository/**/*_repository_impl.go"
        description: 仓储实现
      - pattern: "**/infr/repository/**/*_model.go"
        description: GORM Model
    application:
      - pattern: "**/application/**/*_application_service.go"
        description: 应用服务
    ohs:
      - pattern: "**/ohs/**/*_handler.go"
        description: Handler

state-machine:
  states: [pending, designing, designed, confirmed, coding, coded, failed]
  transitions:
    - from: pending
      to: designing
      trigger: thinker-start
    - from: designing
      to: designed
      trigger: subagent-stop
    - from: designing
      to: designing
      trigger: thinker-start  # 允许幂等重入
    - from: designed
      to: confirmed
      trigger: user-confirm
    - from: confirmed
      to: coding
      trigger: worker-start
    - from: coding
      to: coded
      trigger: subagent-stop
    - from: [designing, coding]
      to: failed
      trigger: error
    - from: failed
      to: pending
      trigger: retry

# 编译验证命令模板（由 Verifier Agent 使用）
verify-build:
  java:
    compile: "mvn compile -q -DskipTests"
    compile-module: "mvn compile -pl {module} -q -DskipTests"
  python:
    compile: "python -m py_compile {files}"
  go:
    compile: "go build ./..."
  typescript:
    compile: "npx tsc --noEmit"
